# GPS-only bring-up test build.
#
# Select with:
#   west build -p always -b promicro_nrf52840/nrf52840 --sysbuild -d build-gps-only . -- -DFILE_SUFFIX=gps_only
# (or scripts/build_ab.sh gps-only in ../proMicro_bootloader for both A/B slots)
#
# Standalone config (not layered on prj.conf): no cellular modem,
# networking, or MQTT config is enabled here, so those subsystems are not
# compiled or linked into this image at all -- just GPS init + console
# logging of fixes. Use this while only the NEO-6M is wired up.

CONFIG_CAR_TRACKER_GPS_ONLY=y

# --- C++ (freestanding subset: no heap, no exceptions, no RTTI) ---
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# Selects the toolchain's libstdc++ *headers* (<type_traits>, <array>,
# <span>); Zephyr's MINIMAL_LIBCPP ships none. Static allocation only --
# we do not use the heap-backed containers.
CONFIG_GLIBCXX_LIBCPP=y

# --- Inter-task messaging ---
CONFIG_ZBUS=y

# --- Hardware watchdog (owned by the supervisor task) ---
CONFIG_WATCHDOG=y
# Task watchdog -- mirror of prj.conf (see the comment there).
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=8
CONFIG_TASK_WDT_MIN_TIMEOUT=8000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000

# Thread names in fault dumps / RTT output.
CONFIG_THREAD_NAME=y

# --- Logging / console ---
CONFIG_LOG=y
# NOTE: deliberately NOT using CONFIG_LOG_MODE_IMMEDIATE. Immediate logging
# writes with interrupts disabled, which breaks the timing of the BLE
# software Link Layer -- Zephyr hard-fails the build on this combination
# (see subsys/bluetooth/common/dummy.c). Deferred logging is the default.

# --- A/B bootloader (MCUboot, direct-XIP with revert) ---
# The app runs in place from slot0 (0x10000) or slot1 (0x84000); MCUboot at
# 0x0 picks the newest valid one. Built through sysbuild (sysbuild.conf) --
# see ../proMicro_bootloader/PLAN.md. The bootloader mode Kconfigs
# (CONFIG_BOOTLOADER_MCUBOOT, ...MODE_DIRECT_XIP_WITH_REVERT) are set by
# sysbuild, not here.
#
# imgtool --rom-fixed stamps the slot's flash address into the image header
# so MCUboot refuses an image uploaded to the wrong slot (each slot needs a
# differently linked image). This is the slot0 value; the slot1 variant is
# built with -DCONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--rom-fixed 0x84000"
# (see ../proMicro_bootloader/scripts/build_slot_b.sh).
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--rom-fixed 0x10000"
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# boot_set_next() (fw_update.cpp marks the inactive slot pending with it).
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_REBOOT=y

# --- Firmware update over USB (mcumgr/SMP on the board CDC-ACM port; logs go to RTT here) ---
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# Some mcumgr handlers need a bigger system workqueue stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# --- Ask MCUboot to stay in USB serial recovery (fw_update::reboot_to_recovery) ---
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

# --- GPS (u-blox NEO-6M via generic NMEA-over-UART driver) ---
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
# NOTE: GNSS_SATELLITES (per-satellite tracking callback) and
# GNSS_DUMP_TO_LOG (driver's own verbose per-fix/per-satellite log dump)
# are deliberately OFF. They were useful before gps_task.cpp had its own
# fix-level logging, but the volume of a full satellite dump on every fix
# floods the RTT log pipeline and starves/corrupts our own ct_gps and
# ct_supervisor log output behind it. satellites_cnt (used in gps_task.cpp)
# is a plain field in gnss_info and does not require GNSS_SATELLITES.

# --- Bluetooth LE: advertise as "car" (identification/debug aid) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="car"

# --- Console over SEGGER RTT (via the J-Link debug probe) ---
# The board's USB-CDC console needs the board's own USB cable AND a working
# USB stack; RTT gives us log output through the SWD probe alone, which is
# what we have connected. Read it with: JLinkRTTClient (or RTT Viewer).
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
# MODE_DROP is mandatory, not a preference: the Zephyr default
# (LOG_BACKEND_RTT_MODE_BLOCK) spins waiting for the host to drain the
# up-buffer with interrupts masked. With no RTT viewer attached the buffer
# fills during boot and that spin stalls the CPU for hundreds of ms, which
# starves the BLE software Link Layer and trips an lll_adv.c assertion ->
# kernel oops -> halt -> watchdog reset -> boot loop. DROP never blocks.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# CDC-ACM console waits 4s for logging at startup; not needed over RTT.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0

# --- Stacks ---
CONFIG_MAIN_STACK_SIZE=2048
