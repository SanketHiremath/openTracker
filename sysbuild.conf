# Sysbuild: build MCUboot alongside the app as an A/B (direct-XIP) bootloader.
# See ../proMicro_bootloader/PLAN.md. Bootloader details live in
# ../proMicro_bootloader/mcuboot.conf (linked as sysbuild/mcuboot.conf).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_DIRECT_XIP_WITH_REVERT=y
# No secure boot yet: MCUboot checks the SHA-256 only, not a signature.
SB_CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
