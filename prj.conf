# Car GPS anti-theft tracker

# --- C++ (freestanding subset: no heap, no exceptions, no RTTI) ---
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n
# Selects the toolchain's libstdc++ *headers*, which is where the
# header-only facilities we use live (<type_traits>, <array>, <span>).
# Zephyr's MINIMAL_LIBCPP ships no standard headers at all. Enabling this
# does not oblige us to use the heap-backed containers -- the codebase
# stays statically allocated by design.
CONFIG_GLIBCXX_LIBCPP=y

# --- Inter-task messaging ---
CONFIG_ZBUS=y

# --- Hardware watchdog (owned by the supervisor task) ---
CONFIG_WATCHDOG=y

# --- Logging / console over USB CDC-ACM ---
# The board's devicetree points zephyr,console at board_cdc_acm_uart (see
# zephyr/boards/common/usb/cdc_acm_serial.dtsi), so logs come out of the Pro
# Micro's own USB port as a virtual serial device -- no SWD probe needed.
# Read it on macOS with e.g.  screen /dev/tty.usbmodem* 115200
# (uart0/uart1 are both claimed by GPS and the modem, so a pin UART console
# is not an option; the bring-up prj_*.conf builds use SEGGER RTT instead.)
CONFIG_LOG=y
# NOTE: deliberately NOT using CONFIG_LOG_MODE_IMMEDIATE. Immediate logging
# writes with interrupts disabled, which breaks the timing of the BLE
# software Link Layer (Zephyr build-asserts on this with several backends;
# see subsys/bluetooth/common/dummy.c). Deferred logging is the default.
#
# Same hazard, learned the hard way: if this build is ever switched to
# SEGGER RTT, CONFIG_LOG_BACKEND_RTT_MODE_DROP=y is mandatory. Zephyr's
# default (LOG_BACKEND_RTT_MODE_BLOCK) spins waiting for the host to drain
# the up-buffer with interrupts masked; with no RTT viewer attached the
# buffer fills during boot and that spin stalls the CPU for hundreds of ms,
# starving the BLE Link Layer and tripping
#   ASSERTION FAIL @ lll_adv.c: prepare_cb: Actual EVENT_OVERHEAD_START_US
# -> kernel oops -> halt -> watchdog reset -> boot loop. The bring-up
# prj_*.conf files use RTT and set MODE_DROP for exactly this reason.

# --- A/B bootloader (MCUboot, direct-XIP with revert) ---
# The app runs in place from slot0 (0x10000) or slot1 (0x84000); MCUboot at
# 0x0 picks the newest valid one. Built through sysbuild (sysbuild.conf) --
# see ../proMicro_bootloader/PLAN.md. The bootloader mode Kconfigs
# (CONFIG_BOOTLOADER_MCUBOOT, ...MODE_DIRECT_XIP_WITH_REVERT) are set by
# sysbuild, not here.
#
# imgtool --rom-fixed stamps the slot's flash address into the image header
# so MCUboot refuses an image uploaded to the wrong slot (each slot needs a
# differently linked image). This is the slot0 value; the slot1 variant is
# built with -DCONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--rom-fixed 0x84000"
# (see ../proMicro_bootloader/scripts/build_slot_b.sh).
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--rom-fixed 0x10000"
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# boot_set_next() (fw_update.cpp marks the inactive slot pending with it).
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_REBOOT=y

# --- Firmware update over USB (mcumgr/SMP on the same CDC-ACM port as the console) ---
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# Logs and SMP share one port: the console driver passes mcumgr frames up to
# the SMP transport instead of dropping them. A log line emitted mid-transfer
# can corrupt a frame (the host retries); keep logging quiet while updating.
CONFIG_UART_CONSOLE_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# Some mcumgr handlers need a bigger system workqueue stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304

# --- Ask MCUboot to stay in USB serial recovery (fw_update::reboot_to_recovery) ---
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

# --- GPS (u-blox NEO-6M via generic NMEA-over-UART driver) ---
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
# NOTE: GNSS_SATELLITES and GNSS_DUMP_TO_LOG deliberately OFF -- see
# prj_gps_only.conf for why (log flooding once gps_task.cpp does its own
# per-fix reporting). satellites_cnt does not require GNSS_SATELLITES.

# --- Bluetooth LE: advertise as "car" (identification/debug aid only,
# not part of the telemetry path) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="car"

# GPS speed and accelerometer vibration frequency as GATT characteristics, behind
# authenticated (passkey) pairing -- see ble_task.cpp's header for the security
# model. CONFIG_CAR_TRACKER_BLE_PASSKEY is a placeholder default: change it
# before this device leaves the bench. Not enabled in prj_gps_only.conf.
CONFIG_CAR_TRACKER_BLE_TELEMETRY=y

# Sleep (System OFF) after kIdleSleepMs without an accelerometer interrupt;
# the interrupt is the only wake source. This drops the USB console and any
# SWD debug session when it triggers -- set to n while debugging. See
# src/tasks/power_task.cpp.
CONFIG_CAR_TRACKER_IDLE_SLEEP=y

# Regulator framework for the optional switched 3.3 V line and modem rails (the
# rail_3v3/modem_vbat nodes in app.overlay, disabled until the hardware has
# switches). Inert without them.
CONFIG_REGULATOR=y

# --- Cellular (Quectel EG916Q-GL AT UART on uart1; the same module's GNSS
# UART is handled by the GNSS section above). Networking is entirely the
# module's own embedded TCP/IP + MQTT-over-TLS AT-command stack (AT+QIACT/
# AT+QMTOPEN/AT+QMTCONN/AT+QMTPUBEX/AT+QSSLCFG/AT+QFUPL) -- see
# drivers/modem/quectel_eg916q.c's header comment and
# quectel_eg800qeg91xq_series_{tcpip,mqtt}_application_note_v1-3.md. No PPP,
# no Zephyr net stack, no on-MCU TLS: none of CONFIG_NETWORKING/CONFIG_NET_*/
# CONFIG_MQTT_LIB/CONFIG_MBEDTLS/CONFIG_TLS_CREDENTIALS are needed, which is
# most of this build's earlier RAM footprint.
CONFIG_MODEM_QUECTEL_EG916Q=y
CONFIG_MODEM_QUECTEL_EG916Q_APN="internet"   # set to your SIM carrier's APN
# Needed by the in-tree GNSS driver (see gps_task.cpp's start()), not by the
# modem driver -- this modem does not participate in Zephyr's PM_DEVICE
# framework at all (see quectel_eg916q.c's header comment).
CONFIG_PM_DEVICE=y

# --- Motion sensors: LSM303DLHC accel + magnetometer, L3GD20 gyro (see the
# i2c0 nodes in app.overlay). CONFIG_SENSOR is what turns the drivers on;
# each pulls in I2C itself. Deliberately NOT in prj_gps_only.conf, which
# leaves the sensor subsystem off so none of this is compiled there.
CONFIG_SENSOR=y

# Accelerometer any-motion interrupt (INT1 -> P1.06). OWN_THREAD, not
# GLOBAL_THREAD: the driver's dispatch does blocking I2C (reading INT1_SRC to
# de-assert the latched line) before our handler runs, and on GLOBAL_THREAD
# that would occupy the shared system workqueue.
CONFIG_LIS2DH_TRIGGER_OWN_THREAD=y
# Priority 3 (default is 10, below every app thread incl. the LED): this
# thread services the motion interrupt, the anti-theft system's primary
# event and the sleep timer's restart signal -- short, bounded work (one
# I2C read + a zbus publish), so it belongs near the top of the app's
# deadline-monotonic priority order. See the table in app_config.hpp.
CONFIG_LIS2DH_THREAD_PRIORITY=3
# Mandatory for the interrupt to work at all: any-motion compares ABSOLUTE
# acceleration against the threshold, so without the on-chip high-pass filter
# ~1 g of gravity exceeds every usable threshold and INT1 stays asserted. This
# symbol exposes SENSOR_ATTR_CONFIGURATION, which writes CTRL_REG2 verbatim.
CONFIG_LIS2DH_ACCEL_HP_FILTERS=y
# Normal (10-bit) mode, not low-power: the driver's low-power scale quantises
# to ~15.6 mg per step, coarser than light vibration. +/-2 g.
CONFIG_LIS2DH_OPER_MODE_NORMAL=y
CONFIG_LIS2DH_ACCEL_RANGE_2G=y
# 100 Hz output data rate: sets the vibration analysis ceiling at 50 Hz
# (Nyquist) so an idling engine's ~27 Hz firing rate is well inside it. Must
# match ct::config::kImuVibrationSampleRateHz, which imu_task.cpp
# static_asserts. Also halves the interrupt duration unit (1 sample = 10 ms)
# and doubles the on-chip high-pass cutoff to ~2 Hz.
CONFIG_LIS2DH_ODR_5=y

# --- Stacks ---
CONFIG_MAIN_STACK_SIZE=4096

# App modules off, Zephyr subsystems default to off. Re-enable app logs with
# CAR_TRACKER_APP_LOGS=y and CONFIG_LOG_DEFAULT_LEVEL=3 once needed again.
CONFIG_CAR_TRACKER_APP_LOGS=n
CONFIG_LOG_DEFAULT_LEVEL=0
